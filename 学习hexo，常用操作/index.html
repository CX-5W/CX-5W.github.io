    <h1 class="p-name article-title" itemprop="headline name">
      学习hexo，常用操作
    </h1>
  

      </header>
    
    <div class="e-content article-entry" itemprop="articleBody">
      
        <h2 id="常用命令"><a href="#常用命令" class="headerlink" title="常用命令"></a>常用命令</h2><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br></pre></td><td class="code"><pre><span class="line">hexo init &lt;name&gt; 初始化一个博客</span><br><span class="line">hexo  new <span class="string">&quot;title&quot;</span> 创建一个文章</span><br><span class="line">hexo new page <span class="string">&quot;页面名&quot;</span> 创建一个页面</span><br><span class="line">hexo new draf <span class="string">&quot;草稿名&quot;</span> 创建一个草稿</span><br><span class="line">hexo publish <span class="string">&quot;draf&quot;</span> 发布草稿成为正式文章</span><br><span class="line">hexo server /hexo s 启动本地服务器</span><br><span class="line">hexo generata /hexo g 生成静态文件</span><br><span class="line">hexo server -p 5000 指定端口号</span><br><span class="line">hexo clear 清除缓存</span><br><span class="line">hexo deploy /hexo d 部署到远程服务器</span><br><span class="line">hexo clean &amp;&amp; hexo g &amp;&amp; hexo d 清除缓存，生成静态文件，部署到远程服务器</span><br><span class="line">hexo list post 查看文章列表</span><br><span class="line">hexo list page 查看页面列表</span><br><span class="line">hexo list draf 查看草稿列表</span><br><span class="line">hexo list tag 查看标签列表</span><br><span class="line">hexo list category 查看分类列表</span><br><span class="line">hexo list layout 查看布局列表</span><br><span class="line">hexo list plugin 查看插件列表</span><br><span class="line">hexo list theme 查看主题列表</span><br><span class="line">hexo version 查看版本信息</span><br></pre></td></tr></table></figure>
<h2 id="典型工作流程"><a href="#典型工作流程" class="headerlink" title="典型工作流程"></a>典型工作流程</h2><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br></pre></td><td class="code"><pre><span class="line">hexo new <span class="string">&quot;title&quot;</span> 创建一个文章</span><br><span class="line">hexo server /hexo s 启动本地服务器</span><br><span class="line">hexo clean &amp;&amp; hexo g &amp;&amp; hexo d 清除缓存，生成静态文件，部署到远程服务器</span><br><span class="line">hexo clean &amp;&amp; hexo g &amp;&amp; hexo s        本地预览</span><br><span class="line">hexo clean &amp;&amp; hexo g &amp;&amp; hexo d        部署上线</span><br></pre></td></tr></table></figure>
<h2 id="常用插件"><a href="#常用插件" class="headerlink" title="常用插件"></a>常用插件</h2><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">hexo-helper-live2d 插件，用于在博客中添加live2d模型</span><br></pre></td></tr></table></figure>
